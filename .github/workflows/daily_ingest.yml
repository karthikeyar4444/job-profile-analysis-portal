name: Daily USAJOBS ingest

on:
  schedule:
    - cron: "23 11 * * *"   # every day at 11:23 UTC (6:23 am Eastern)
  workflow_dispatch:         # lets you run it by hand from the Actions tab

permissions:
  contents: write            # needed to commit the updated data back to the repo

concurrency:
  group: daily-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install "pandas>=1.5" "numpy>=1.23"

      - name: Fetch open federal data & tech postings
        env:
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}
          PYTHONPATH: src
        run: python -m jobportal.live.ingest --data-dir data/live

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "data: daily USAJOBS snapshot $(date -u +%F)"
            git push
          fi
